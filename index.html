<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlixHub" />
    <title>FlixHub — Movies &amp; Series</title>
    <script>
      // Apply the saved theme (dark | cinema) before first paint to avoid a flash.
      try {
        if (localStorage.getItem('flixhub-theme') === 'cinema') {
          document.documentElement.dataset.theme = 'cinema';
        }
      } catch (e) {}
    </script>

    {/* Cinematic display type for the hero titles */}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased bg-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWA: register the service worker (offline support + installability).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
